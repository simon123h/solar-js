<!doctype html>
<html lang="en">
  <head>
    <title>Solar System Simulation</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="css/style.css" rel="stylesheet" />
    <script type="module" src="src/main.ts"></script>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="details-view"></div>
    <div id="stats-box">loading...</div>
    <div id="settings">
      <button id="pause-button" type="button">Pause</button>
      <button id="reset-button" type="button">Reset</button>
      <select id="speed-select" title="Simulation speed">
        <option value="0.25">0.25x</option>
        <option value="0.5">0.5x</option>
        <option value="1" selected>1x</option>
        <option value="2">2x</option>
        <option value="4">4x</option>
      </select>
      <select id="universe-select">
        <option value="solar-system">Solar System</option>
        <option value="galaxy-collision">Galaxy Collision</option>
        <option value="galaxy-collision-halo">Galaxy Collision + Halo</option>
        <option value="galaxy-collision-realistic">Galaxy Collision + Halo + Bulge</option>
        <option value="n-body-universe">N-Body Problem</option>
      </select>
    </div>
  </body>
</html>
