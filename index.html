<!doctype html>
<html lang="en">
  <head>
    <title>Solar System Simulation</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="css/style.css" rel="stylesheet" />
    <script type="module" src="src/main.ts"></script>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="details-view"></div>
    <div id="stats-box">loading...</div>
    <div id="solar-panel" hidden>
      <h2>Solar System</h2>
      <label class="row">
        Asteroids
        <select id="solar-asteroids"></select>
      </label>
      <fieldset>
        <legend>Planets</legend>
        <label><input type="checkbox" id="solar-pluto" /> Include Pluto</label>
      </fieldset>
    </div>
    <div id="n-body-panel" hidden>
      <h2>N-Body Problem</h2>
      <label class="row">
        Number of bodies
        <select id="n-body-count"></select>
      </label>
      <label class="row">
        Initial velocity
        <select id="n-body-velocity"></select>
      </label>
      <label class="row" id="n-body-velocity-scale-row">
        Velocity scale
        <span><input type="range" id="n-body-velocity-scale" /> <output id="n-body-velocity-scale-value"></output></span>
      </label>
      <fieldset>
        <legend>Mass</legend>
        <label><input type="checkbox" id="n-body-varied-masses" /> Varied masses</label>
      </fieldset>
    </div>
    <div id="galaxy-panel" hidden>
      <h2>Galaxy collision</h2>
      <label class="row">
        Preset
        <select id="galaxy-preset"></select>
      </label>
      <fieldset>
        <legend>Physics</legend>
        <label><input type="checkbox" id="galaxy-halo" /> Dark matter halos</label>
        <label><input type="checkbox" id="galaxy-bulge" /> Extended bulges</label>
        <label><input type="checkbox" id="galaxy-friction" /> Dynamical friction (galaxies merge)</label>
      </fieldset>
      <fieldset>
        <legend>Rotation</legend>
        <label class="row">
          Milky Way
          <select id="galaxy-spin-0">
            <option value="1">Prograde</option>
            <option value="-1">Retrograde</option>
          </select>
        </label>
        <label class="row">
          Andromeda
          <select id="galaxy-spin-1">
            <option value="1">Prograde</option>
            <option value="-1">Retrograde</option>
          </select>
        </label>
      </fieldset>
      <fieldset>
        <legend>Encounter</legend>
        <label class="row">
          Orbit
          <select id="galaxy-encounter">
            <option value="fast">Fast pass</option>
            <option value="custom">Custom orbit</option>
          </select>
        </label>
        <label class="row">
          Closest approach
          <span><input type="range" id="galaxy-pericenter" /> <output id="galaxy-pericenter-value"></output></span>
        </label>
        <label class="row">
          Eccentricity
          <span><input type="range" id="galaxy-eccentricity" /> <output id="galaxy-eccentricity-value"></output></span>
        </label>
      </fieldset>
      <label class="row">
        Stars per galaxy
        <select id="galaxy-stars"></select>
      </label>
      <p id="galaxy-message" role="alert"></p>
    </div>
    <div id="controls-bar">
      <div id="time-controls" class="control-group">
        <button id="pause-button" class="btn" type="button" title="Pause / Resume simulation">
          <span id="pause-label">Pause</span>
        </button>
        <button id="reset-button" class="btn" type="button" title="Reset scenario">Reset</button>
        <div class="select-wrapper">
          <select id="speed-select" title="Simulation speed">
            <option value="0.25">0.25x</option>
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="2">2x</option>
            <option value="4">4x</option>
          </select>
        </div>
      </div>
      <div class="control-group">
        <div class="select-wrapper">
          <select id="universe-select" title="Select scenario">
            <option value="solar-system">Solar System</option>
            <option value="galaxy-collision">Galaxy Collision</option>
            <option value="n-body-universe">N-Body Problem</option>
          </select>
        </div>
        <button id="scenario-settings-button" class="btn" type="button">Settings</button>
      </div>
    </div>
  </body>
</html>
